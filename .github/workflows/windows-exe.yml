name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.16'
      - name: Run integration tests
        run: python scripts/run_checks.py

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.16'
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build bundled EXE
        shell: python
        run: |
          import os, re, subprocess, sys
          environment = {**os.environ, "PYTHONIOENCODING": "utf-8"}
          result = subprocess.run([sys.executable, "scripts/build_windows.py"],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  text=True, encoding="utf-8", errors="replace", env=environment)
          print(result.stdout, flush=True)
          if result.returncode:
              message = re.sub(r"[A-Za-z0-9_-]{43,}", "[redacted-long-value]", result.stdout[-5000:])
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Windows EXE build failed::{message}", flush=True)
          raise SystemExit(result.returncode)
      - name: Test the actual executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD\dist\Remote222.exe" -ArgumentList "--self-test --report `"$PWD\dist\windows-selftest.json`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path dist/windows-selftest.json) {
              Get-Content dist/windows-selftest.json
              $failure = Get-Content dist/windows-selftest.json -Raw | ConvertFrom-Json
              $message = "$($failure.error)" -replace '[A-Za-z0-9_-]{43,}', '[redacted-long-value]'
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Frozen EXE self-test failed::$message"
            }
            throw "EXE self-test failed: $($process.ExitCode)"
          }
          $report = Get-Content dist/windows-selftest.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'EXE self-test report did not pass' }
          Get-Content dist/windows-selftest.json
      - name: Save Windows download
        uses: actions/upload-artifact@v6
        with:
          name: Remote222-Windows-x64
          path: |
            dist/Remote222.exe
            dist/Remote222.exe.sha256
            dist/windows-selftest.json
          if-no-files-found: error
      - name: Publish versioned download
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/Remote222.exe dist/Remote222.exe.sha256 dist/windows-selftest.json --verify-tag --title "Remote222 $env:RELEASE_TAG — Windows EXE" --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
